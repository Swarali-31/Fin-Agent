services:
  - type: web
    name: finagent
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeployTrigger: off
    healthCheckPath: /api/v1/health
    envVars:
      - key: SECURE_COOKIES
        value: "true"
      - key: CORS_ORIGINS
        sync: false
      - key: SUPABASE_DB_HOST
        sync: false
      - key: SUPABASE_DB_USER
        sync: false
      - key: SUPABASE_DB_PASSWORD
        sync: false
      - key: LLM_PROVIDER
        value: google_genai
      - key: LLM_MODEL
        value: gemini-3.5-flash-lite
      - key: LLM_FALLBACK_MODEL
        value: gemini-3.6-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: SEARCH_PROVIDER
        value: tavily
      - key: TAVILY_API_KEY
        sync: false
